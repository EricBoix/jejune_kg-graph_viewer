<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- > on the left, pointing right (inward toward center) -->
  <polyline
    points="10,18 44,50 10,82"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- < on the right, pointing left (inward toward center) -->
  <polyline
    points="90,18 56,50 90,82"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
